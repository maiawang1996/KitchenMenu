<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI 家庭菜单</title>
    <meta name="theme-color" content="#f3ece1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20260728v" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <p class="eyebrow" id="todayText">今天</p>
        </div>
        <div class="topbar-center">
          <h1 id="pageTitle">今天在厨房</h1>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="addRecipeTop" aria-label="新增菜谱" hidden></button>
        </div>
      </header>

      <section id="view" class="view"></section>

      <nav class="tabbar" aria-label="底部导航">
        <button class="tab active" data-tab="today" data-icon="sun"><small>今天</small></button>
        <button class="tab" data-tab="recipes" data-icon="book"><small>菜谱</small></button>
        <button class="tab" data-tab="plan" data-icon="calendar"><small>菜单</small></button>
        <button class="tab" data-tab="stock" data-icon="pantry"><small>库存</small></button>
        <button class="tab" data-tab="journal" data-icon="note"><small>札记</small></button>
      </nav>
    </main>

    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </div>
    </div>

    <script src="./app.js?v=20260728v"></script>
  </body>
</html>
